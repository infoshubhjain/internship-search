name: Update Internship Tracker

on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    # The full pipeline now queries ~164 company boards plus ~86 Workday
    # tenants, so it needs more than the default patience but must not hang.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Offline and fast. Running them first means a broken parser or
        # classifier cannot commit bad data over a tracker holding real history.
        run: |
          python test_tracker.py
          python test_international.py

      - name: Update US tracker
        # Scrape, merge, discover boards, refresh H-1B if a new year exists,
        # ATS enrich, sync history and urgency. Aborts before the merge if the
        # scrape fails, so a bad upstream day leaves the tracker untouched.
        run: python update_all.py

      - name: Update international tracker
        # Independent of the US pipeline: one failing must not block the other.
        if: always()
        run: python intl_tracker.py

      - name: Check deadlines
        if: always()
        run: python master_integration.py deadlines

      - name: Report new priority listings
        if: always()
        run: python master_integration.py alerts
        env:
          TRACKER_EMAIL: ${{ secrets.TRACKER_EMAIL }}
          TRACKER_EMAIL_PASSWORD: ${{ secrets.TRACKER_EMAIL_PASSWORD }}

      - name: Score calibration report
        # Prints "not enough data yet" until enough applications have outcomes.
        if: always()
        run: python calibrate.py

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- Summer2027_SWE_Tracker.csv enhanced_scraped_internships.csv \
                     Summer2027_Intl_Tracker.csv INTERNATIONAL_REPORT.md \
                     discovered_boards.json workday_tenants.json \
                     h1b_sponsors.json.gz
          git diff --staged --quiet || git commit -m "Update internship trackers [skip ci]"
          git push
