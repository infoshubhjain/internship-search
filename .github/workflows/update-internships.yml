name: Update Internship Tracker

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run enhanced scraper
      run: |
        python enhanced_scraper.py
        
    - name: Run merge script
      run: |
        python merge_internship_data.py
        
    - name: Run deadline checks
      run: |
        python master_integration.py deadlines
        
    - name: Run backup
      run: |
        python master_integration.py backup
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Summer2027_SWE_Tracker.csv scraped_internships.csv enhanced_scraped_internships.csv
        git diff --staged --quiet || git commit -m "Update internship tracker [skip ci]"
        git push